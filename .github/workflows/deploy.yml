name: Deploy to School Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Bypass SCP and transfer via SSH
        run: |
          # 빌드된 dist 폴더를 하나의 압축 파일로 만듭니다.
          tar -czf dist.tar.gz dist/
          
          # sshpass(비밀번호 자동입력기)를 설치합니다.
          sudo apt-get install -y sshpass
          
          # SCP 프로토콜을 쓰지 않고, 텍스트 스트림으로 파일을 강제 주입합니다.
          cat dist.tar.gz | sshpass -p "${{ secrets.PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} ${{ secrets.USERNAME }}@${{ secrets.SERVER_HOST }} 'cat > /tmp/dist.tar.gz'

      - name: Unzip and deploy on server using sudo
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "${{ secrets.PASSWORD }}" | sudo -S mkdir -p /var/www/html/2026

            # 서버에 들어간 압축 파일을 해제하며 바로 목적지에 덮어씌웁니다.
            echo "${{ secrets.PASSWORD }}" | sudo -S tar -xzf /tmp/dist.tar.gz -C /var/www/html/2026/ --strip-components=1

            # 찌꺼기 파일 정리
            echo "${{ secrets.PASSWORD }}" | sudo -S rm -f /tmp/dist.tar.gz

            # 이전에 잘못 생성된 conf.d 파일 제거
            echo "${{ secrets.PASSWORD }}" | sudo -S rm -f /etc/nginx/conf.d/2026-spa.conf

            # React SPA 새로고침 404 방지: location /2026/ 블록이 없을 때만 삽입
            echo "${{ secrets.PASSWORD }}" | sudo -S grep -q 'location /2026/' /etc/nginx/sites-available/default || echo "${{ secrets.PASSWORD }}" | sudo -S sed -i "s|location / {|location /2026/ {\n        root /var/www/html;\n        try_files \$uri \$uri/ /2026/index.html;\n    }\n\n    location / {|" /etc/nginx/sites-available/default
            echo "${{ secrets.PASSWORD }}" | sudo -S nginx -t && echo "${{ secrets.PASSWORD }}" | sudo -S systemctl reload nginx
