name: Deploy to School Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Transfer files via SSH
        run: |
          sudo apt-get install -y sshpass rsync

          # 바뀐 파일만 전송 (서버의 /tmp/deploy-2026 을 스테이징 폴더로 사용)
          export SSHPASS='${{ secrets.PASSWORD }}'
          sshpass -e rsync -rz --delete --timeout=120 \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }}" \
            dist/ ${{ secrets.USERNAME }}@${{ secrets.SERVER_HOST }}:/tmp/deploy-2026/

      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            echo "${{ secrets.PASSWORD }}" | sudo -S mkdir -p /var/www/html/2026

            # 스테이징 → 서비스 폴더 (서버 내부 복사, 바뀐 파일만)
            echo "${{ secrets.PASSWORD }}" | sudo -S rsync -rl --no-perms --no-owner --no-group /tmp/deploy-2026/ /var/www/html/2026/

            # nginx 설정 테스트 후 재시작 (reload 아닌 restart로 다운 상태도 복구)
            echo "${{ secrets.PASSWORD }}" | sudo -S nginx -t
            echo "${{ secrets.PASSWORD }}" | sudo -S systemctl restart nginx
            echo "${{ secrets.PASSWORD }}" | sudo -S systemctl status nginx --no-pager | head -5
