<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="2026 서원대학교 미디어콘텐츠학부 졸업전시 - 기록들: 졸업전시 준비과정 영상 페이지." />
  <title>기록들 | 2026 서원대학교 미디어콘텐츠학부 졸업전시</title>
  <style>
    /* ===================================================
       RESET & BASE
    =================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ph-light:    #E0E0E0;
      --ph-mid:      #CCCCCC;
      --ph-dark:     #AAAAAA;
      --ph-text:     #888888;

      --color-bg:      #F7F7F7;
      --color-header:  #FFFFFF;
      --color-border:  #DDDDDD;
      --color-text:    #222222;
      --color-muted:   #666666;

      --font-main:   'Noto Sans KR', sans-serif;
      --radius:      6px;
      --shadow:      0 4px 18px rgba(0,0,0,0.10);
      --transition:  0.22s ease;

      --header-h:    68px;
      --content-max: 1180px;
      --video-max:   900px;   /* 영상 최대 너비 */
    }

    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-main);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===================================================
       PLACEHOLDER UTILITY
    =================================================== */
    .ph {
      background: var(--ph-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ph-text);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-align: center;
      border: 1.5px dashed var(--ph-mid);
      border-radius: var(--radius);
      padding: 8px;
      user-select: none;
    }

    /* ===================================================
       LAYOUT
    =================================================== */
    .container {
      width: 100%;
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 0 28px;
    }

    /* ===================================================
       HEADER
    =================================================== */
    #site-header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: var(--header-h);
      background: var(--color-header);
      border-bottom: 1px solid var(--color-border);
      z-index: 1000;
      display: flex;
      align-items: center;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 0 28px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .logo-ph {
      width: 42px; height: 42px;
      flex-shrink: 0;
      font-size: 0.6rem;
    }

    .logo-text { display: flex; flex-direction: column; line-height: 1.3; }
    .logo-text .subtitle { font-size: 0.64rem; color: var(--color-muted); }
    .logo-text .title    { font-size: 0.88rem; font-weight: 700; }

    .site-nav { display: flex; align-items: center; gap: 8px; }

    .nav-link {
      display: block;
      padding: 8px 14px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--color-muted);
      text-decoration: none;
      border-radius: var(--radius);
      transition: background var(--transition), color var(--transition);
      white-space: nowrap;
    }
    .nav-link:hover { background: var(--ph-light); color: var(--color-text); }

    /* 현재 페이지 강조 */
    .nav-link.active {
      background: var(--color-text);
      color: #FFFFFF;
      font-weight: 700;
    }
    .nav-link.active:hover {
      background: #444444;
    }

    /* 햄버거 버튼 */
    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 6px;
      background: none;
      border: none;
      border-radius: var(--radius);
    }
    .menu-toggle span {
      display: block;
      width: 24px; height: 2px;
      background: var(--color-text);
      border-radius: 2px;
    }

    /* ===================================================
       MAIN — 단일 섹션: 기록들
    =================================================== */
    #records {
      flex: 1;                       /* 푸터를 하단에 고정 */
      margin-top: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 28px 100px;
    }

    .records-inner {
      width: 100%;
      max-width: var(--video-max);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    /* 타이틀 영역 */
    .records-head {
      text-align: center;
    }

    .records-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ph-text);
      margin-bottom: 14px;
    }

    .records-title {
      font-size: 2.4rem;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--color-text);
      margin-bottom: 16px;
    }

    .records-divider {
      width: 48px;
      height: 3px;
      background: var(--color-text);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .records-desc {
      font-size: 0.94rem;
      color: var(--color-muted);
      line-height: 1.9;
      word-break: keep-all;
    }

    /* 영상 플레이어 플레이스홀더 */
    .video-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }

    .video-ph {
      width: 100%;
      aspect-ratio: 16 / 9;          /* 16:9 비율 유지 */
      background: var(--ph-mid);
      border: none;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: var(--ph-text);
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* 재생 아이콘 */
    .play-btn {
      width: 72px; height: 72px;
      border: 2.5px solid var(--ph-text);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .play-btn::after {
      content: '';
      border-top:    14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left:   24px solid var(--ph-text);
      margin-left: 5px;
    }

    .video-ph-label {
      font-size: 0.88rem;
      color: var(--ph-text);
      letter-spacing: 0.04em;
    }

    /* ===================================================
       FOOTER
    =================================================== */
    #site-footer {
      background: var(--color-text);
      color: rgba(255,255,255,0.65);
      padding: 56px 0;
      border-top: 1px solid #333;
    }

    .footer-inner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 32px;
      flex-wrap: wrap;
    }

    .footer-brand .school-name      { font-size: 1rem; font-weight: 700; color: #FFFFFF; margin-bottom: 8px; }
    .footer-brand .dept-name        { font-size: 0.82rem; margin-bottom: 4px; }
    .footer-brand .exhibit-name-small { font-size: 0.78rem; opacity: 0.5; }

    .footer-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.82rem;
      text-align: right;
    }

    .footer-info span {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-end;
    }

    .footer-copy {
      width: 100%;
      padding-top: 32px;
      margin-top: 32px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.74rem;
      text-align: center;
      opacity: 0.4;
    }

    /* ===================================================
       SCROLL REVEAL
    =================================================== */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.65s ease, transform 0.65s ease;
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ===================================================
       RESPONSIVE
    =================================================== */
    @media (max-width: 768px) {
      .records-title { font-size: 1.8rem; }
      #records { padding: 60px 20px 80px; }
    }

    @media (max-width: 620px) {
      .records-title { font-size: 1.4rem; }
      #records { padding: 48px 16px 64px; }

      .site-nav { display: none; flex-direction: column; }
      .site-nav.open {
        display: flex;
        position: fixed;
        top: var(--header-h);
        left: 0; width: 100%;
        background: #FFFFFF;
        border-bottom: 1px solid var(--color-border);
        padding: 12px 0 16px;
        z-index: 999;
        box-shadow: var(--shadow);
      }
      .nav-link { padding: 12px 28px; }
      .menu-toggle { display: flex; }

      .footer-inner { flex-direction: column; }
      .footer-info { text-align: left; }
      .footer-info span { justify-content: flex-start; }

      .play-btn { width: 56px; height: 56px; }
      .play-btn::after {
        border-top-width: 10px;
        border-bottom-width: 10px;
        border-left-width: 18px;
      }
    }
  </style>
</head>
<body>

  <!-- ==============================
       HEADER
  ============================== -->
  <header id="site-header" role="banner">
    <div class="header-inner">

      <a href="index.html" class="logo-area" aria-label="메인 홈으로">
        <div class="ph logo-ph">LOGO</div>
        <div class="logo-text">
          <span class="subtitle">서원대학교 미디어콘텐츠학부</span>
          <span class="title">2026 졸업전시</span>
        </div>
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="site-nav" id="siteNav" aria-label="주요 메뉴">
        <a href="sub1.html" class="nav-link">작품소개</a>
        <a href="sub2.html" class="nav-link">학부소개</a>
        <a href="sub3.html" class="nav-link active" aria-current="page">기록들</a>
        <a href="sub4.html" class="nav-link">과거전시보기</a>
      </nav>

    </div>
  </header>


  <!-- ==============================
       SECTION 1 — 기록들 (영상)
  ============================== -->
  <main id="records" aria-label="졸업전시 준비과정 영상">
    <div class="records-inner">

      <!-- 타이틀 -->
      <div class="records-head reveal">
        <p class="records-eyebrow">Behind the Exhibition</p>
        <h1 class="records-title">우리의 준비 과정</h1>
        <div class="records-divider"></div>
        <p class="records-desc">
          2026 졸업전시를 완성하기까지의 모든 순간을 담은 영상을 만나보세요.
        </p>
      </div>

      <!-- 영상 플레이어 플레이스홀더 -->
      <div class="video-wrapper reveal" style="transition-delay: 0.15s;">
        <div
          class="video-ph"
          role="img"
          aria-label="졸업전시 준비과정 영상 재생 영역"
        >
          <div class="play-btn" aria-hidden="true"></div>
          <span class="video-ph-label">졸업전시 준비과정 영상 재생 영역</span>
        </div>
      </div>

    </div>
  </main>


  <!-- ==============================
       FOOTER
  ============================== -->
  <footer id="site-footer" role="contentinfo">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <p class="school-name">서원대학교</p>
          <p class="dept-name">미디어콘텐츠학부</p>
          <p class="exhibit-name-small">2026 졸업전시</p>
        </div>
        <div class="footer-info">
          <span>📍 충청북도 청주시 서원구 무심서로 377-3</span>
          <span>📞 043-299-8114</span>
        </div>
      </div>
      <p class="footer-copy">
        &copy; 2026 서원대학교 미디어콘텐츠학부 졸업전시. All rights reserved.
      </p>
    </div>
  </footer>


  <!-- ==============================
       SCRIPT
  ============================== -->
  <script>
    /* 햄버거 메뉴 */
    const toggle = document.getElementById('menuToggle');
    const nav    = document.getElementById('siteNav');

    toggle.addEventListener('click', () => {
      const isOpen = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen);
    });

    /* 스크롤 리빌 */
    const revealEls = document.querySelectorAll('.reveal');
    const observer  = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.12 }
    );
    revealEls.forEach((el) => observer.observe(el));
  </script>

</body>
</html>
