
<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="서원대학교 미디어콘텐츠학부 2026 졸업전시회 포트폴리오" />

  <title>Portfolio | 2026 Seowon University Graduates</title>

  <!-- 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  />

  <!-- 기존 포트폴리오 CSS -->
  <link rel="stylesheet" href="css/projectpage.css" />

  <!-- 공통 헤더 / 푸터 CSS -->
  <link rel="stylesheet" href="css/common.css" />

  <!-- 공통 헤더 / 푸터 JS -->
  <script src="js/common.js" defer></script>

  <!-- 기존 포트폴리오 JS -->
  <script src="js/project.js" defer></script>

</head>

<body>

  <!-- ======================================
       공통 헤더
  ====================================== -->
  <div id="common-header"></div>


  <!-- ======================================
       포트폴리오 메인
  ====================================== -->
  <main id="work">

    <!-- 페이지 타이틀 -->
    <section class="intro" aria-labelledby="page-title">

      <h1 id="page-title">Portfolio</h1>

      <p class="intro-korean">
        질문에서 시작된 가능성이 하나의 결과물을 만들어낸 순간을 소개합니다.
      </p>

      <p class="intro-english">
        2026 Seowon University Graduates
      </p>

    </section>


    <!-- ====================================
         메인 카테고리
    ==================================== -->
    <section class="media-section" aria-label="작품 분야 선택">

      <div class="media-categories">

        <!-- 멀티미디어 -->
        <button
          type="button"
          class="media-category is-active"
          data-category="multimedia"
          aria-pressed="true"
        >
          <span
            class="asset-slot category-icon"
            data-image-key="multimedia"
          ></span>

          <span class="category-label">
            멀티미디어
          </span>
        </button>


        <!-- 영상미디어 -->
        <button
          type="button"
          class="media-category"
          data-category="video"
          aria-pressed="false"
        >
          <span
            class="asset-slot category-icon"
            data-image-key="video"
          ></span>

          <span class="category-label">
            영상미디어
          </span>
        </button>


        <!-- XR 프로젝트 -->
        <button
          type="button"
          class="media-category"
          data-category="xr"
          aria-pressed="false"
        >
          <span
            class="asset-slot category-icon"
            data-image-key="xr"
          ></span>

          <span class="category-label">
            XR 프로젝트
          </span>
        </button>

      </div>

    </section>


    <!-- ====================================
         작품 필터 / 목록
    ==================================== -->
    <section class="portfolio-section" aria-label="작품 모아보기">

      <!-- 하위 필터 (JS 자동 생성) -->
      <div
        class="role-filters"
        id="role-filters"
        role="group"
        aria-label="작품 필터"
      ></div>


      <!-- 작품 카드 (JS 자동 생성) -->
      <div
        class="portfolio-grid"
        id="portfolio-grid"
        aria-live="polite"
      ></div>


      <!-- 검색 결과가 없는 경우 -->
      <p
        class="empty-state"
        id="empty-state"
        hidden
      >
        해당 조건에 맞는 작품이 없습니다.
      </p>

    </section>

  </main>


  <!-- ======================================
       공통 푸터
  ====================================== -->
  <div id="common-footer"></div>


  <!-- ======================================
       맨 위로 이동
  ====================================== -->
  <button
    type="button"
    class="back-to-top"
    id="back-to-top"
    aria-label="맨 위로 이동"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">

      <path
        d="M12 21V3M4.5 10.5 12 3l7.5 7.5"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

    </svg>
  </button>

</body>
</html>
